[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonforge"
version = "0.1.0"
description = "A reusable Python workflow execution engine"
requires-python = ">=3.13"

[project.scripts]
pythonforge = "pythonforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
